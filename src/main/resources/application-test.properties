# ===============================
# H2 Database (for tests only)
# ===============================
spring.datasource.url=jdbc:h2:mem:streeteatdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ===============================
# FLYWAY
# ===============================
# Migrations under db/migration are written in Postgres-specific SQL
# (BIGSERIAL, DO $$ blocks, etc.) and are not H2-compatible. Now that
# flyway-core is an actual dependency, it must be explicitly disabled here
# so tests use Hibernate's ddl-auto instead.
spring.flyway.enabled=false
