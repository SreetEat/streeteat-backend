# ==============================
# PostgreSQL (Staging)
# ==============================
# SECURITY NOTE: this file previously had a hardcoded real-looking password
# ("prabhanshupriyanshi") committed directly to a public GitHub repo. That
# password must be treated as compromised and rotated immediately -- editing
# this file does not remove it from git history. See the completion report
# for details. Credentials now come from environment variables only, with no
# committed fallback password.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/streeteats}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# Flyway
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
