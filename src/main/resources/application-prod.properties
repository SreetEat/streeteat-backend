# ===============================
# DATABASE (DOCKER / RDS)
# ===============================
# All three of these are meant to be overridden by real environment
# variables (docker-compose already does this; an EC2/RDS deployment must
# set them too). The fallbacks below are docker-compose-network defaults
# ONLY, not real production credentials.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/streeteat_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:streeteat}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate, not update: Flyway (below) owns the schema now that it's actually
# wired up (see pom.xml). Letting Hibernate also auto-alter the schema here
# risked silent drift between what Flyway created and what Hibernate decided
# to bolt on -- validate instead just confirms the entities match what
# Flyway built, and fails loudly if they don't.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
