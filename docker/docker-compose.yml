services:
  app:
    container_name: ${APP_NAME:-streeteat-api}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-streeteat_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-streeteat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env -- see docker/.env.example}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - streeteat_network

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streeteat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-streeteat_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streeteat} -d ${POSTGRES_DB:-streeteat_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - streeteat_network

volumes:
  pgdata:

networks:
  streeteat_network:
    driver: bridge
